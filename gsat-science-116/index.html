<script>const questions=[{"id":1,"subject":"生物","topic":"細胞構造","level":"基礎","stem":"下列關於真核細胞的敘述，何者正確？","options":["所有真核細胞都具有葉綠體","細胞膜只允許水分子通過","粒線體是細胞進行有氧呼吸的重要場所","核糖體由雙層膜包覆"],"answers":[2],"explanation":"粒線體參與有氧呼吸及 ATP 生成；核糖體沒有膜，葉綠體並非所有真核細胞都有，細胞膜具選擇性通透性。","table":null},{"id":2,"subject":"生物","topic":"酵素與實驗","level":"進階","stem":"某組學生以相同濃度的過氧化氫及等量過氧化氫酶，測得不同溫度下前 30 秒產生的氧氣體積如下。根據結果，何者正確？","options":["只要繼續升溫，反應速率必定增加","40°C 是所測溫度中反應速率最高者","60°C 的結果證明酵素已完全失去活性","此實驗的操縱變因是氧氣體積"],"answers":[1],"explanation":"氧氣產量為應變變因，溫度為操縱變因。40°C 的產氣量最高，但不能由離散測點斷言精確最適溫度，也不能由 60°C 的結果斷言完全失活。","table":{"headers":["溫度（°C）","氧氣體積（mL）"],"rows":[[10,2],[25,8],[40,15],[60,1]]}},{"id":3,"subject":"生物","topic":"光合作用與呼吸","level":"中等","stem":"將健康綠色水草置於透明密閉容器，在光照充足且其他條件適宜時，若觀察到水中溶氧量上升，下列推論何者最合理？","options":["水草不再進行細胞呼吸","水草已停止吸收二氧化碳","水草的粒線體停止運作","光合作用產氧速率大於呼吸耗氧速率（忽略其他生物與氣體交換）"],"answers":[3],"explanation":"光照下植物仍進行呼吸作用；溶氧淨增加表示光合作用的產氧量超過呼吸耗氧量（在題設假定下）。","table":null},{"id":4,"subject":"生物","topic":"細胞分裂","level":"中等","stem":"某二倍體生物的體細胞有 8 條染色體。正常完成減數分裂後，一個配子通常含多少條染色體？","options":["16 條","2 條","8 條","4 條"],"answers":[3],"explanation":"2n＝8，因此 n＝4。減數分裂使染色體套數減半，受精時恢復為二倍體。","table":null},{"id":5,"subject":"生物","topic":"孟德爾遺傳","level":"中等","stem":"某植物種子黃色（Y）對綠色（y）為完全顯性，兩株基因型皆為 Yy 的植物互交。子代為黃色且基因型為 Yy 的機率為何？","options":["1/2","1/4","3/4","1/3"],"answers":[0],"explanation":"Yy × Yy 的子代基因型 YY : Yy : yy＝1:2:1，因此 Yy 占全部子代的 1/2。題目不是問黃色子代中 Yy 的比例。","table":null},{"id":6,"subject":"生物","topic":"DNA 與基因表現","level":"基礎","stem":"下列何者正確描述一般細胞中蛋白質合成的過程？","options":["DNA 直接離開細胞核，作為核糖體的原料","所有 DNA 序列都必然會被轉譯成蛋白質","轉譯是由蛋白質製造 DNA 的過程","mRNA 的核苷酸序列可在核糖體上被轉譯成胺基酸序列"],"answers":[3],"explanation":"基因表現中，DNA 可轉錄形成 RNA，蛋白質編碼的 mRNA 再由核糖體轉譯；並非所有 DNA 序列都編碼蛋白質。","table":null},{"id":7,"subject":"生物","topic":"遺傳物質","level":"進階","stem":"某雙股 DNA 分子中，腺嘌呤（A）占全部鹼基的 30%。以下敘述哪些正確？（選 2 項）","options":["胸腺嘧啶 T 占 30%","胞嘧啶 C 占 20%","A 與 G 的總比例為 60%","鳥嘌呤 G 占 40%","DNA 的兩股鹼基排列完全相同"],"answers":[0,1],"explanation":"雙股 DNA 中 A＝T、G＝C，因此 A、T 各 30%，G、C 各 20%。兩股互補而非必然相同。","table":null},{"id":8,"subject":"生物","topic":"演化與天擇","level":"中等","stem":"某細菌族群原本就有少數具抗藥性個體，使用抗生素後，抗藥性細菌所占比例提高。下列何者最能解釋此現象？","options":["抗生素使所有細菌的基因定向改變","具抗藥性的個體在環境中有較高存活及繁殖機會","所有細菌因需要抗藥性而產生相同突變","細菌為了適應環境主動改寫全部 DNA"],"answers":[1],"explanation":"天擇作用於族群中已有的可遺傳變異，使有利性狀在特定環境中較容易留下後代；並非生物依需求定向突變。","table":null},{"id":9,"subject":"生物","topic":"親緣與演化","level":"中等","stem":"鯨魚的前肢與蝙蝠的前肢骨骼排列有相似的基本構造，但功能不同。這項證據最能支持下列何者？","options":["兩者必然屬於同一物種","兩者具有共同祖先，構造可能經演化形成不同功能","兩者生活環境完全相同","兩者由相同個體演化而來"],"answers":[1],"explanation":"同源構造具有相似的構造基礎，支持共同祖先；功能可因不同選汰壓力而分化。","table":null},{"id":10,"subject":"生物","topic":"生態能量流動","level":"中等","stem":"某草地食物鏈為草 → 蝗蟲 → 青蛙 → 蛇。假設每一營養階層轉移至下一階層的能量皆為 10%，若生產者階層能量為 20,000 kJ，蛇所在階層約獲得多少能量？","options":["20 kJ","2,000 kJ","200 kJ","2 kJ"],"answers":[0],"explanation":"從草到蛇共經歷三次能量轉移，20,000 × 0.1³＝20 kJ。10% 為題設簡化值。","table":null},{"id":11,"subject":"生物","topic":"族群與環境","level":"進階","stem":"某研究記錄池塘中藻類的相對數量。四組除了光照及磷酸鹽條件外皆相同，培養 7 日後結果如下。依資料，哪些推論合理？（選 2 項）","options":["弱光、高磷酸鹽組的藻類數量最高","實驗證明藻類可在完全無光下行光合作用","磷酸鹽是所有水域唯一限制因子","在強光下，增加磷酸鹽與藻類數量增加有關","在低磷酸鹽條件下，強光組藻類數量較弱光組多"],"answers":[3,4],"explanation":"在強光下，藻類由 30 增至 90；低磷條件下由 15 增至 30。結果限於本實驗條件，不能推廣為所有水域的唯一限制因子。","table":{"headers":["光照","磷酸鹽","相對數量"],"rows":[["弱","低",15],["弱","高",25],["強","低",30],["強","高",90]]}},{"id":12,"subject":"生物","topic":"探究與實作","level":"進階","stem":"學生想檢驗不同濃度食鹽水對同種種子的發芽率是否有影響。下列設計何者最適當？","options":["每種濃度使用不同植物種子","同時改變食鹽濃度、溫度與光照，再比較發芽率","設置純水對照組，各組種子數相同，控制光照與溫度並重複實驗","每組放一粒種子，不需重複實驗"],"answers":[2],"explanation":"設置對照組、控制其他變因，並增加樣本及重複次數，可提高結果的可靠性及因果推論能力。","table":null},{"id":13,"subject":"地科・天文","topic":"晝夜與地球自轉","level":"基礎","stem":"在臺灣觀測，一夜之中多數恆星看似由東向西移動，主要原因為何？","options":["月球引力使所有恆星移動","恆星每天繞地球公轉一圈","地球由西向東自轉","地球由東向西公轉"],"answers":[2],"explanation":"地球由西向東自轉，造成天球視運動大致由東向西。","table":null},{"id":14,"subject":"地科・天文","topic":"四季成因","level":"中等","stem":"臺灣在夏至附近白晝較長且正午太陽仰角較高，主要原因為何？","options":["地球夏季距離太陽最近","地球自轉軸傾斜且繞太陽公轉","太陽夏季的直徑顯著變大","地球夏季自轉速度大幅降低"],"answers":[1],"explanation":"四季主要來自地軸傾斜及公轉，使太陽直射緯度、日照時間與入射角改變，而非地日距離主導。","table":null},{"id":15,"subject":"地科・天文","topic":"月相與日月食","level":"中等","stem":"關於月相與日月食，下列何者正確？","options":["日食可能發生於新月附近，月食可能發生於滿月附近","滿月時月球必定進入地球影子","月相變化主要來自地球影子遮住月球","每次新月都一定發生日食"],"answers":[0],"explanation":"月相是日照半球與觀測角度改變所致。日食需要月球位於日地之間且接近交點；月食則是地球位於日月之間且月球進入地影。","table":null},{"id":16,"subject":"地科・天文","topic":"天體尺度","level":"基礎","stem":"下列天體或系統按典型空間尺度由小到大排列，何者正確？","options":["地球 → 銀河系 → 太陽系 → 可觀測宇宙","地球 → 太陽系 → 銀河系 → 可觀測宇宙","太陽系 → 地球 → 可觀測宇宙 → 銀河系","銀河系 → 太陽系 → 地球 → 可觀測宇宙"],"answers":[1],"explanation":"地球是太陽系的一員，太陽系位於銀河系，銀河系只是可觀測宇宙中的眾多星系之一。","table":null},{"id":17,"subject":"地科・天文","topic":"恆星光譜與距離","level":"進階","stem":"假設兩顆恆星的實際光度完全相同，且忽略星際消光。觀測結果如下。哪些敘述正確？（選 2 項）","options":["甲星的表面溫度較乙星高","乙星比甲星近","甲星比乙星近","視亮度只與表面溫度相關","乙星的表面溫度較甲星高"],"answers":[2,4],"explanation":"相同光度且忽略消光時，視亮度較高者較近。藍白色恆星通常比紅色恆星表面溫度高。","table":{"headers":["恆星","顏色","視亮度（相對值）"],"rows":[["甲","紅色",4],["乙","藍白色",1]]}},{"id":18,"subject":"地科・天文","topic":"宇宙膨脹","level":"進階","stem":"天文學家觀測到多數遙遠星系的光譜具有紅移，且在大尺度下，距離愈遠的星系平均退行速度愈大。下列何者最符合此結果？","options":["地球是宇宙唯一的中心","所有星系彼此間距離都一定縮短","光的紅移表示光波波長變短","宇宙在大尺度上正在膨脹"],"answers":[3],"explanation":"星系大尺度退行與宇宙膨脹一致，並不意味地球是膨脹中心；紅移對應觀測波長增加。局部受重力束縛的系統不必隨膨脹分離。","table":null},{"id":19,"subject":"地科・海洋","topic":"潮汐","level":"基礎","stem":"在一般情況下，大潮（潮差較大）最可能出現於哪些月相附近？（選 2 項）","options":["新月","下弦月","上弦月","滿月","任何月相都完全相同"],"answers":[0,3],"explanation":"新月及滿月時日、地、月近似成一直線，太陽與月球的起潮效應較相加；上弦與下弦附近常為小潮。","table":null},{"id":20,"subject":"地科・海洋","topic":"潮位圖判讀","level":"中等","stem":"某港口的簡化潮位紀錄如下。根據表格，下列何者正確？","options":["6 時至 12 時潮位下降","當日潮差約 0.8 m","12 時為表中最低潮位","當日潮差約 2.4 m"],"answers":[3],"explanation":"最高觀測潮位 2.8 m，最低 0.4 m，兩者差 2.4 m；6 至 12 時由 0.4 m 上升至 2.6 m。實際極值仍須更密集觀測。","table":{"headers":["時刻","潮位（m）"],"rows":[["00:00",2.8],["06:00",0.4],["12:00",2.6],["18:00",0.6]]}},{"id":21,"subject":"地科・海洋","topic":"洋流與臺灣","level":"中等","stem":"黑潮沿臺灣東部海域大致向北流動。關於黑潮的敘述何者正確？","options":["完全由地震引起","屬於由低緯向較高緯輸送熱量的暖流","流向不受大尺度風系及地球自轉影響","主要是從北極流向赤道的寒流"],"answers":[1],"explanation":"黑潮是北太平洋西邊界暖流，向較高緯度輸送熱量；其形成與大尺度風系、地球自轉及海洋環流有關。","table":null},{"id":22,"subject":"地科・海洋","topic":"海水密度與環流","level":"中等","stem":"比較兩團海水，在相同壓力下且不考慮接近結冰等特殊情況，哪一團通常具有較大密度？","options":["低溫、低鹽度一定比低溫高鹽度大","高溫、低鹽度","低溫、高鹽度","高溫、高鹽度一定比低溫高鹽度大"],"answers":[2],"explanation":"一般海水密度隨溫度降低、鹽度增加而增大；高密度海水有下沉傾向，參與深層環流。","table":null},{"id":23,"subject":"地科・海洋","topic":"湧升流與漁場","level":"進階","stem":"某沿岸海域表層水被風吹向外海，深層海水上升補充。下列哪些敘述合理？（選 2 項）","options":["海水上升只能由海嘯造成","沿岸表層水溫可能降低","上升海水可能補充表層營養鹽","湧升流必然使表層海水比原先更熱","湧升流必然使初級生產力降至零"],"answers":[1,2],"explanation":"深層水通常較冷且富含營養鹽；湧升可促進浮游植物生長並有利漁場形成，但實際生產力仍受光照等因素限制。","table":null},{"id":24,"subject":"地科・海洋","topic":"聖嬰現象","level":"進階","stem":"比較正常年份與典型聖嬰事件期間，赤道太平洋的觀測如下。何者最合理？","options":["聖嬰是由月相改變單獨造成","聖嬰時赤道東太平洋湧升流通常增強","聖嬰時赤道東太平洋海溫異常偏低","聖嬰時東西向信風減弱，暖水較易向東擴展"],"answers":[3],"explanation":"典型聖嬰時信風減弱，暖水向中、東太平洋擴展，東太平洋冷水湧升通常減弱，海溫偏高。","table":{"headers":["觀測項目","正常年","聖嬰年"],"rows":[["東風信風","較強","較弱"],["赤道東太平洋海溫異常","接近 0°C","+2°C"]]}},{"id":25,"subject":"物理","topic":"運動與圖表","level":"中等","stem":"某物體沿直線運動，其速度由 0 秒時的 2 m/s 均勻增加至 4 秒時的 10 m/s。這 4 秒的位移為何？","options":["16 m","40 m","24 m","8 m"],"answers":[2],"explanation":"速度－時間圖下的帶正負號面積為位移。平均速度＝(2＋10)/2＝6 m/s，位移＝6×4＝24 m。","table":{"headers":["時間（s）","速度（m/s）"],"rows":[[0,2],[1,4],[2,6],[3,8],[4,10]]}},{"id":26,"subject":"物理","topic":"牛頓運動定律","level":"中等","stem":"質量 2 kg 的物體在水平地面上受到向右 10 N 的推力及向左 4 N 的摩擦力，其他水平方向作用力忽略。下列何者正確？","options":["推力與摩擦力互為作用力及反作用力","加速度向右，大小 5 m/s²","加速度向右，大小 3 m/s²","合力向左，大小 6 N"],"answers":[2],"explanation":"水平合力＝10－4＝6 N，加速度 a＝F/m＝3 m/s²，向右。作用與反作用力必須作用在不同物體上。","table":null},{"id":27,"subject":"物理","topic":"能量守恆","level":"中等","stem":"一個 2 kg 物體由離地 5 m 處靜止落下，忽略空氣阻力，取 g＝10 m/s²。物體到達離地 1 m 處時，動能為何？","options":["40 J","100 J","80 J","20 J"],"answers":[2],"explanation":"下降高度 4 m，重力位能減少 mgh＝2×10×4＝80 J，轉為動能。","table":null},{"id":28,"subject":"物理","topic":"波動與電磁波","level":"中等","stem":"關於聲波與電磁波，下列哪些敘述正確？（選 2 項）","options":["可見光是電磁波的一種","聲波可在理想真空中傳播","在同一均勻介質中，若波速固定，波長較長者頻率較低","真空中無線電波比可見光傳得快","電磁波皆需空氣作為傳播介質"],"answers":[0,2],"explanation":"聲波須介質，電磁波可在真空傳播；真空中各種電磁波速率相同。由 v＝fλ 得知固定波速下頻率與波長成反比。","table":null},{"id":29,"subject":"物理","topic":"電能與功率","level":"中等","stem":"某電器額定功率為 800 W，在額定狀態下持續運轉 30 分鐘，消耗的電能約為多少度（kWh）？","options":["0.04 度","24 度","0.4 度","2.4 度"],"answers":[2],"explanation":"800 W＝0.8 kW，30 分鐘＝0.5 h，電能＝Pt＝0.4 kWh。","table":null},{"id":30,"subject":"物理","topic":"電磁感應","level":"進階","stem":"將條形磁鐵移近接有靈敏電流計的線圈。若其他條件不變，下列何者最合理？","options":["磁鐵停在線圈附近時仍必然有持續感應電流","磁鐵移遠時感應電流方向必與移近相同","磁鐵移近速度越快，感應電動勢的大小通常越大（比較相同位置附近）","只有接觸線圈才會產生感應電流"],"answers":[2],"explanation":"法拉第電磁感應定律：感應電動勢與磁通量變化率有關；磁鐵靜止且磁通量不變時無持續感應電流。移遠與移近的感應方向通常相反。","table":null},{"id":31,"subject":"物理","topic":"光電效應","level":"進階","stem":"以兩種不同頻率的單色光分別照射同一金屬表面，兩者頻率皆高於金屬的臨界頻率。下列哪些敘述正確？（選 2 項）","options":["提高光強度必定提高光電子的最大動能","頻率較高者的光子能量較大","頻率較低者必定具有較短的真空波長","光電子能量與金屬種類無關","頻率較高者可使光電子最大動能較大"],"answers":[1,4],"explanation":"光子能量 E＝hf，光電子最大動能 Kmax＝hf－φ。固定頻率時，提高光強度主要影響光電子數目，而非最大動能。","table":null},{"id":32,"subject":"物理","topic":"基本交互作用與核能","level":"基礎","stem":"太陽長期釋出能量的主要核反應，屬於下列何者？","options":["核分裂","電子與原子核間的普通化學反應","核融合","化石燃料燃燒"],"answers":[2],"explanation":"太陽核心主要透過氫核融合形成氦，部分質量轉化為能量。","table":null},{"id":33,"subject":"化學","topic":"物質分類","level":"基礎","stem":"下列何者在一般化學分類中屬於均勻混合物？","options":["完全溶解且未析出的食鹽水","純氧氣","蒸餾水","純氯化鈉晶體"],"answers":[0],"explanation":"食鹽水由水及溶質組成，宏觀成分均勻，屬均勻混合物；蒸餾水、純氧與純氯化鈉視為純物質。","table":null},{"id":34,"subject":"化學","topic":"原子結構與同位素","level":"基礎","stem":"碳-12 與碳-14 互為同位素，兩種中性原子具有下列何種關係？","options":["質子數及中子數皆相同","質子數不同、電子數相同","電子數不同、中子數相同","質子數相同、中子數不同"],"answers":[3],"explanation":"碳原子序 6，因此兩者質子數及中性原子的電子數皆為 6；中子數分別為 6 與 8。","table":null},{"id":35,"subject":"化學","topic":"化學鍵與物質性質","level":"中等","stem":"下列關於氯化鈉及水的敘述，哪些正確？（選 2 項）","options":["氯化鈉晶體主要由獨立 NaCl 分子組成","氯化鈉水溶液可導電，是因溶液中存在可移動的離子","水分子內的 O—H 鍵屬氫鍵","固態氯化鈉中的離子可自由移動，因此容易導電","水分子內 O—H 鍵為共價鍵"],"answers":[1,4],"explanation":"氯化鈉是離子晶體，溶於水後離子可移動；水分子內 O—H 為極性共價鍵，水分子間可形成氫鍵。","table":null},{"id":36,"subject":"化學","topic":"莫耳與化學計量","level":"中等","stem":"甲烷完全燃燒反應式為 CH₄＋2O₂ → CO₂＋2H₂O。若 16 g 甲烷完全燃燒，至少需要多少克氧氣？（原子量 C＝12、H＝1、O＝16）","options":["16 g","48 g","64 g","32 g"],"answers":[2],"explanation":"16 g CH₄＝1 mol，需 2 mol O₂。O₂ 莫耳質量為 32 g/mol，因此需 64 g。","table":null},{"id":37,"subject":"化學","topic":"溶液濃度","level":"中等","stem":"取 100 mL、濃度 0.50 M 的食鹽水，加水稀釋至總體積 250 mL（無溶質損失），濃度為何？","options":["0.50 M","0.20 M","0.10 M","1.25 M"],"answers":[1],"explanation":"稀釋前後溶質莫耳數不變，M₁V₁＝M₂V₂，因此 0.50×100/250＝0.20 M。","table":null},{"id":38,"subject":"化學","topic":"酸鹼與中和","level":"中等","stem":"25°C 時，將 0.10 M 鹽酸與等體積 0.10 M 氫氧化鈉水溶液完全混合（視為理想稀溶液），混合後何者最合理？","options":["pH 約為 13","pH 約為 1","pH 約為 3","pH 約為 7"],"answers":[3],"explanation":"強酸與強鹼的莫耳數相等，H⁺ 與 OH⁻ 完全中和，生成水與 NaCl，25°C 時理想近似 pH＝7。","table":null},{"id":39,"subject":"化學","topic":"氧化還原","level":"中等","stem":"將鋅片放入硫酸銅水溶液，發生 Zn(s)＋Cu²⁺(aq) → Zn²⁺(aq)＋Cu(s)。下列哪些敘述正確？（選 2 項）","options":["反應過程沒有電子轉移","Zn 失去電子，發生氧化","Cu²⁺ 得到電子，發生還原","Zn 是氧化劑","Cu²⁺ 失去電子，發生氧化"],"answers":[1,2],"explanation":"Zn → Zn²⁺＋2e⁻，被氧化、為還原劑；Cu²⁺＋2e⁻ → Cu，被還原、為氧化劑。","table":null},{"id":40,"subject":"化學","topic":"反應熱與能量","level":"進階","stem":"某學生以簡易隔熱容器混合兩種水溶液，混合前後溫度如下表。在忽略外界熱交換，且沒有其他顯著物理熱效應的假設下，何者正確？","options":["反應吸熱，溶液將能量傳給反應系統","只要溫度升高，反應速率必定為零","反應熱必為正值","反應放熱，使周圍溶液溫度上升"],"answers":[3],"explanation":"溫度上升代表周圍溶液吸收熱量，題設下反應放熱，定壓反應焓變 ΔH 為負。","table":{"headers":["時間","溫度（°C）"],"rows":[["混合前",25],["混合後",32]]}}];const subjects=['生物','地科・天文','地科・海洋','物理','化學'];const KEY='science_review_116_v1';const letters='ABCDE';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}let state={answers:{},flags:[],current:1,filter:'全部',submitted:false,remaining:3900,running:false,deadline:null,...saved};let view=state.submitted?'summary':'intro';if(state.running&&state.deadline){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(!state.remaining){state.running=false;state.deadline=null;}}const $=x=>document.getElementById(x);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function ans(q){return state.answers[q.id]||[]}function correct(q){return ans(q).length===q.answers.length&&q.answers.every(a=>ans(q).includes(a))}function visible(){return questions.filter(q=>state.filter==='全部'||(state.filter==='標記'&&state.flags.includes(q.id))||(state.filter==='錯題'&&state.submitted&&!correct(q))||q.subject===state.filter)}function refreshNav(){let filters=['全部',...subjects,'標記',...(state.submitted?['錯題']:[])];$('filters').innerHTML=filters.map(s=>`<button class="${state.filter===s?'active':''}" onclick="setFilter('${s}')">${s}</button>`).join('');$('nav').innerHTML=visible().map(q=>`<button aria-label="第 ${q.id} 題${ans(q).length?' 已作答':''}" class="${state.submitted?(correct(q)?'right':'wrong'):(ans(q).length?'done':'')} ${view==='question'&&state.current===q.id?'current':''} ${state.flags.includes(q.id)?'flagged':''}" onclick="go(${q.id})">${q.id}</button>`).join('');let count=questions.filter(q=>ans(q).length).length;$('progressText').textContent=`已作答 ${count} / ${questions.length}`;$('progressBar').style.width=(count/questions.length*100)+'%';$('submitBtn').textContent=state.submitted?'成績總覽':'交卷評分';$('timerBtn').disabled=state.submitted||state.remaining<=0;$('keyBtn').disabled=!state.submitted;updateClock();persist()}function setFilter(s){state.filter=s;let v=visible();if(v.length){state.current=v[0].id;view='question'}else view='empty';render()}function go(id){state.current=id;view='question';render();if(window.innerWidth<=760)$('main').scrollIntoView({behavior:'smooth',block:'start'})}function move(d){let v=visible(),i=v.findIndex(q=>q.id===state.current);if(v[i+d])go(v[i+d].id)}function selectAnswer(id,index){if(state.submitted)return;let q=questions[id-1];let a=ans(q).slice();if(q.answers.length===1)a=[index];else if(a.includes(index))a=a.filter(x=>x!==index);else a.push(index);state.answers[id]=a;persist();renderQuestion(false);refreshNav()}function clearAnswer(){if(!state.submitted){delete state.answers[state.current];render()}}function flag(){let i=state.flags.indexOf(state.current);if(i<0)state.flags.push(state.current);else state.flags.splice(i,1);render()}function tableHTML(q){if(!q.table)return '';let t=q.table;return `<div class="table-wrap"><table><thead><tr>${t.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function graphHTML(q){if(![2,20,25].includes(q.id))return '';let rows=q.table.rows;let values=rows.map(r=>Number(r[1]));let max=Math.max(...values)*1.15;let x=i=>52+(typeof rows[0][0]==='number'?(rows[i][0]-rows[0][0])/(rows[rows.length-1][0]-rows[0][0]):i/(rows.length-1))*300,y=v=>138-v/max*112;let pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<svg class="chart" viewBox="0 0 380 172" role="img" aria-label="${esc(q.table.headers.join(' 與 '))} 折線圖"><path d="M52 16V138H360" fill="none" stroke="#61758a" stroke-width="1.4"/>${[0,0.25,0.5,0.75,1].map(f=>`<path d="M52 ${y(max*f)}H352" stroke="#dce4ed" stroke-dasharray="3 3"/><text x="46" y="${y(max*f)+4}" text-anchor="end" font-size="10" fill="#53657a">${+(max*f).toFixed(1)}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="#087c80" stroke-width="2.5"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(values[i])}" r="4" fill="#087c80"/><text x="${x(i)}" y="${y(values[i])-8}" text-anchor="middle" font-size="10" fill="#172b42">${values[i]}</text><text x="${x(i)}" y="153" text-anchor="middle" font-size="10" fill="#53657a">${esc(r[0])}</text>`).join('')}<text x="52" y="11" font-size="10" fill="#53657a">${esc(q.table.headers[1])}</text></svg>`}function renderQuestion(focus=true){let q=questions[state.current-1],v=visible(),idx=v.findIndex(x=>x.id===q.id);let selected=ans(q);let options=q.options.map((o,i)=>{let isSel=selected.includes(i),isKey=q.answers.includes(i);let cls=state.submitted?(isKey?'correct':isSel?'incorrect':''):(isSel?'selected':'');return `<label class="option ${cls}"><input type="${q.answers.length>1?'checkbox':'radio'}" name="q${q.id}" ${isSel?'checked':''} ${state.submitted?'disabled':''} onchange="selectAnswer(${q.id},${i})"><span class="letter">${letters[i]}.</span><span>${esc(o)} ${state.submitted&&isKey?' ✓':''}</span></label>`}).join('');$('main').innerHTML=`<div class="qmeta"><strong>第 ${q.id} / 40 題</strong><span class="tag subject">${q.subject}</span><span class="tag">${q.topic}</span><span class="tag">${q.level}</span><span>${q.answers.length>1?'多選｜選 2 項':'單選'}</span></div><div class="qtitle">${esc(q.stem)}</div>${tableHTML(q)}${graphHTML(q)}<div role="group" aria-label="選項">${options}</div>${state.submitted?`<div class="explain"><strong>${correct(q)?'答對了':'需要複習'}｜正確答案：${q.answers.map(i=>letters[i]).join('、')}</strong><p>${esc(q.explanation)}</p></div>`:''}<div class="qbottom"><div><button onclick="move(-1)" ${idx<=0?'disabled':''}>← 上一題</button><button class="primary" onclick="move(1)" ${idx>=v.length-1?'disabled':''}>下一題 →</button></div><div><button onclick="flag()">${state.flags.includes(q.id)?'◆ 取消標記':'◇ 標記'}</button>${!state.submitted?'<button onclick="clearAnswer()">清除</button>':'<button onclick="showSummary()">成績</button>'}</div></div>`}function showInstructions(){view='intro';render()}function showSummary(){view='summary';render()}function renderIntro(){$('main').innerHTML=`<div class="qmeta"><span class="tag subject">課程說明</span><span class="tag">120 分鐘</span></div><h2>把弱點找出來，再把觀念補回去。</h2><p>本練習以學測部定必修為範圍，包含基礎觀念、資料判讀與探究設計。40 題分科配置如下：</p><table><thead><tr><th>科目</th><th>題號</th><th>建議作答</th></tr></thead><tbody><tr><td>生物</td><td>1–12</td><td>19 分鐘</td></tr><tr><td>天文</td><td>13–18</td><td>9 分鐘</td></tr><tr><td>海洋</td><td>19–24</td><td>9 分鐘</td></tr><tr><td>物理</td><td>25–32</td><td>14 分鐘</td></tr><tr><td>化學</td><td>33–40</td><td>14 分鐘</td></tr></tbody></table><h3>作答規則</h3><p>單選題選 1 項，多選題選 2 項。每題 2.5 分，多選需全對才得分；不倒扣。此為課堂診斷計分，非正式學測計分。</p><p>作答時可標記不確定的題目，交卷後查看正確率、各科表現及詳解。計時器為提醒，不會自動交卷。</p><button class="primary" onclick="startQuiz()">${state.submitted?'查看成績':Object.keys(state.answers).length?'繼續作答':'開始作答'}</button><details class="teacher"><summary>教師用｜120 分鐘流程</summary><p>0–5 分鐘：說明作答與標記方式。<br>5–70 分鐘：學生獨立作答。<br>70–75 分鐘：交卷、記錄弱科。<br>75–110 分鐘：生物、天文、海洋優先檢討，物化以錯題為主。<br>110–120 分鐘：遮住詳解重做錯題、出口票（寫出兩個迷思與修正觀念）。</p></details>`}function startQuiz(){if(state.submitted){showSummary();return}state.filter='全部';if(!state.running&&state.remaining>0){state.running=true;state.deadline=Date.now()+state.remaining*1000;}go(state.current)}function submitQuiz(){if(state.submitted){showSummary();return}let n=questions.filter(q=>ans(q).length).length;let incomplete=questions.filter(q=>ans(q).length!==q.answers.length).length;if(!confirm(`已作答 ${n}/40 題，${incomplete} 題未完成或選項數不符。確定交卷？`))return;state.submitted=true;state.running=false;state.deadline=null;state.filter='全部';showSummary()}function renderSummary(){let c=questions.filter(correct).length;let n=questions.filter(q=>ans(q).length>0).length;let wrong=questions.filter(q=>!correct(q));let scores=subjects.map(s=>{let qs=questions.filter(q=>q.subject===s);return {s,n:qs.length,c:qs.filter(correct).length}});$('main').innerHTML=`<div class="qmeta"><span class="tag subject">學習診斷</span></div><h2>本次練習結果</h2><div class="summary-grid"><div class="metric"><strong>${c*2.5}</strong><span>總分 / 100</span></div><div class="metric"><strong>${c}/40</strong><span>答對題數</span></div><div class="metric"><strong>${n}/40</strong><span>作答題數</span></div></div><h3>各主題正確率</h3>${scores.map(s=>`<div class="score-row"><span>${s.s}</span><div class="progress-track"><div style="width:${s.c/s.n*100}%"></div></div><span>${s.c}/${s.n} (${Math.round(s.c/s.n*100)}%)</span></div>`).join('')}<p class="muted">建議先檢討正確率最低的主題，再回到標記題。未答及多選未全對均列入錯題。</p><button class="primary" onclick="setFilter('錯題')" ${wrong.length?'':'disabled'}>檢視錯題 (${wrong.length})</button> <button onclick="setFilter('全部')">全部詳解</button><h3>錯題清單</h3><div class="review-list">${wrong.length?wrong.map(q=>`<button onclick="state.filter='錯題';go(${q.id})">Q${q.id} · ${q.subject}｜${q.topic} <span class="muted">${ans(q).length?'作答不全對':'未作答'}</span></button>`).join(''):'<p>全部答對！可再挑戰標記題。</p>'}</div>`}function render(){if(view==='intro')renderIntro();else if(view==='summary')renderSummary();else if(view==='empty')$('main').innerHTML=`<h2>目前沒有符合條件的題目。</h2><button onclick="setFilter('全部')">回到全部題目</button>`;else renderQuestion();refreshNav()}function updateClock(){let m=Math.floor(state.remaining/60),s=state.remaining%60;$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('clock').classList.toggle('warn',state.remaining<=300);$('timerBtn').textContent=state.running?'暫停計時':state.remaining===0?'時間到':'開始計時'}function toggleTimer(){if(state.submitted||!state.remaining)return;if(state.running){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));state.running=false;state.deadline=null}else{state.running=true;state.deadline=Date.now()+state.remaining*1000}refreshNav()}setInterval(()=>{if(state.running){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(!state.remaining){state.running=false;state.deadline=null;refreshNav();}updateClock();persist()}},1000);function resetQuiz(){if(!confirm('確定清除本裝置的所有作答與計時紀錄？'))return;state={answers:{},flags:[],current:1,filter:'全部',submitted:false,remaining:3900,running:false,deadline:null};view='intro';render()}function printQuiz(key){if(key&&!state.submitted)return;let out=`<h1>116 學測自然｜高三重點衝刺 ${key?'教師答案卷':'學生試題卷'}</h1><p>40 題・65 分鐘・單選 31 題、多選 9 題 ${key?'':'｜班級：________ 姓名：________'}</p>`;for(let s of subjects){out+=`<h2>${s}</h2>`;for(let q of questions.filter(x=>x.subject===s)){if(key){out+=`<div class="printkey"><b>${q.id}. ${q.answers.map(i=>letters[i]).join('、')} ｜${q.topic}</b><br>${esc(q.explanation)}</div>`}else{out+=`<div class="printq"><b>${q.id}. ${esc(q.stem)}</b>${tableHTML(q)}${q.options.map((o,i)=>`<div class="printopt">${letters[i]}. ${esc(o)}</div>`).join('')}</div>`}}}$('printArea').innerHTML=out;window.print()}render();</script></body></html>
